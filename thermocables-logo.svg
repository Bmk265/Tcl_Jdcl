<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512" height="512"
     role="img"
     aria-labelledby="tcTitle tcDesc">
  <title id="tcTitle">Thermocables</title>
  <desc id="tcDesc">Hexagonal industrial badge with a gradient lightning bolt symbolizing electrical power</desc>

  <defs>
    <!-- Navy → Blue background gradient -->
    <linearGradient id="tcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Blue → Purple → Amber bolt gradient (cold to hot = "thermo") -->
    <linearGradient id="tcBolt" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"    stop-color="#3b82f6"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="1"    stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Blue → Amber ring gradient -->
    <linearGradient id="tcRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Soft outer glow for the bolt -->
    <filter id="tcGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon body -->
  <path d="M 256 16 L 464 136 L 464 376 L 256 496 L 48 376 L 48 136 Z"
        fill="url(#tcBg)"/>

  <!-- Gradient outline (energized border) -->
  <path d="M 256 16 L 464 136 L 464 376 L 256 496 L 48 376 L 48 136 Z"
        fill="none"
        stroke="url(#tcRing)"
        stroke-width="8"
        stroke-linejoin="round"
        opacity="0.55"/>

  <!-- Inner hexagon detail ring -->
  <path d="M 256 64 L 422 160 L 422 352 L 256 448 L 90 352 L 90 160 Z"
        fill="none"
        stroke="#3b82f6"
        stroke-width="2"
        stroke-linejoin="round"
        opacity="0.22"/>

  <!-- Lightning bolt -->
  <path d="M 288 96 L 176 272 L 240 272 L 208 416 L 336 224 L 272 224 Z"
        fill="url(#tcBolt)"
        filter="url(#tcGlow)"/>

  <!-- Amber tip glow dot -->
  <circle cx="208" cy="416" r="9" fill="#fbbf24" opacity="0.92"/>
</svg>
